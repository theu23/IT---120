<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Son Solar | Log in</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --ink: #102f50;
      --muted: #526476;
      --navy: #172533;
      --panel: #fffefa;
      --line: #d8e0e7;
      --accent: #b95f00;
      --accent-dark: #914900;
      --success: #2d795d;
      --error: #b84238;
      --shadow: 0 24px 70px rgba(5, 24, 42, 0.24);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      color: #fff;
      background: #142f5e;
      font-family: 'DM Sans', Arial, sans-serif;
    }

    .page {
      min-height: 100svh;
      display: grid;
    }

    .login-shell {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
      gap: clamp(36px, 7vw, 104px);
      align-items: center;
      padding: clamp(96px, 13vh, 132px) clamp(24px, 8vw, 120px) clamp(40px, 7vh, 72px);
      background:
        linear-gradient(90deg, rgba(8, 35, 61, 0.88) 0%, rgba(10, 47, 75, 0.68) 48%, rgba(12, 36, 52, 0.72) 100%),
        url('https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1800&q=90') center / cover;
    }

    .login-shell::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 28, 47, 0.08), rgba(8, 28, 47, 0.28));
      pointer-events: none;
      z-index: -1;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      color: var(--navy);
      background: #ffc45a;
      box-shadow: 0 5px 16px rgba(255, 196, 90, 0.3);
      font-size: 1.1rem;
    }

    .brand-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      max-width: 600px;
      padding: 30px 0;
      color: #fff8e8;
      background: transparent;
    }

    .brand-panel .eyebrow:last-child { margin-bottom: 0; }

    .eyebrow {
      margin: 0 0 22px;
      color: #ffd071;
      font: 700 0.72rem/1.2 'DM Sans', Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-lockup {
      max-width: 430px;
      margin: 0 0 30px;
      color: #ffd071;
      font: 700 clamp(3.4rem, 6.2vw, 6.4rem)/0.88 'Space Grotesk', Arial, sans-serif;
      letter-spacing: -0.07em;
      text-transform: uppercase;
    }

    .brand-lockup span {
      display: block;
      color: #fff8e8;
      font-size: 0.58em;
      letter-spacing: 0.08em;
    }

    .quote {
      max-width: 390px;
      margin: 0;
      color: #d4d9e2;
      font: italic clamp(1.05rem, 1.5vw, 1.25rem)/1.6 'Fraunces', Georgia, serif;
    }

    .login-panel {
      grid-column: 2;
      justify-self: stretch;
      z-index: 1;
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(30px, 4vw, 46px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 10px;
      color: var(--ink);
      font: 600 clamp(1.9rem, 3vw, 2.3rem)/1.1 'Space Grotesk', Arial, sans-serif;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font: 0.92rem/1.5 'DM Sans', Arial, sans-serif;
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font: 0.78rem/1.3 'DM Sans', Arial, sans-serif;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0;
      text-transform: none;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .forgot-link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link:hover { text-decoration: underline; }

    form { display: grid; gap: 17px; }
    .field { display: flex; flex-direction: column; gap: 8px; }

    label {
      color: var(--ink);
      font: 700 0.73rem/1.2 'DM Sans', Arial, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fff;
      font: 1rem/1.25 'DM Sans', Arial, sans-serif;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(185, 95, 0, 0.14);
    }

    input[aria-invalid="true"] { border-color: var(--error); }
    .field-message { min-height: 0; margin: 0; color: var(--error); font: 0.74rem/1.2 'DM Sans', Arial, sans-serif; }

    .password-input { position: relative; }
    .password-input input { padding-right: 68px; }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: 0;
      min-height: 40px;
      padding: 8px;
      color: var(--accent-dark);
      background: transparent;
      cursor: pointer;
      font: 700 0.7rem/1 'DM Sans', Arial, sans-serif;
      text-transform: uppercase;
    }

    .submit-button {
      border: 0;
      min-height: 52px;
      border-radius: 9px;
      padding: 15px 20px;
      color: #fffaf3;
      background: var(--accent);
      cursor: pointer;
      font: 700 0.82rem/1 'DM Sans', Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 160ms ease, transform 160ms ease;
    }

    .submit-button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .submit-button:focus-visible, .create-link:focus-visible, .password-toggle:focus-visible, .forgot-link:focus-visible {
      outline: 3px solid #ffd071;
      outline-offset: 3px;
    }

    .create-account {
      margin: 22px 0 0;
      color: #4f5868;
      text-align: center;
      font: 0.88rem/1.4 'DM Sans', Arial, sans-serif;
    }

    .create-link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .create-link:hover { text-decoration: underline; }

    .login-message {
      display: none;
      margin: 0;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--success);
      border: 1px solid rgba(45, 121, 93, 0.25);
      background: rgba(45, 121, 93, 0.08);
      font: 0.85rem/1.4 'DM Sans', Arial, sans-serif;
    }

    .login-message.visible { display: block; }

    @media (max-width: 760px) {
      .login-shell {
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        align-content: start;
        gap: clamp(20px, 4vh, 32px);
        padding: 88px 24px 40px;
      }

      .brand-panel { width: min(100%, 480px); padding: 0 2px; }
      .eyebrow { margin-bottom: 12px; font-size: 0.66rem; }
      .brand-lockup { margin-bottom: 14px; font-size: clamp(2.6rem, 11vw, 4rem); }
      .quote { max-width: 440px; font-size: 1rem; }
      .brand-panel .eyebrow:last-child { display: none; }
      .login-panel { grid-column: 1; justify-self: center; width: min(100%, 480px); padding: 30px clamp(22px, 6vw, 36px); }
    }

    @media (max-width: 420px) {
      .login-shell { gap: 16px; padding: 84px 16px 28px; }
      .brand-mark { width: 34px; height: 34px; }
      .login-panel { padding: 26px 20px; border-radius: 14px; }
      .intro { margin-bottom: 22px; }
      .intro { margin-bottom: 22px; }
      form { gap: 14px; }
      .login-options { font-size: 0.74rem; }
    }

    @media (max-height: 680px) and (min-width: 761px) {
      .login-shell { padding-top: 88px; padding-bottom: 28px; }
      .login-panel { padding-top: 28px; padding-bottom: 28px; }
      .intro { margin-bottom: 20px; }
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="login-shell" aria-labelledby="login-title">
      <div class="brand-panel">
        <p class="eyebrow">Power your next chapter</p>
        <p class="brand-lockup">Sun Son<span>Solar</span></p>
        <h2>Start<br>somewhere<br>good.</h2>
        <p class="quote">Create your account and keep your details in one simple, secure place.</p>
      </div>
      <div class="login-panel">
        <a class="card-brand" href="login.html" aria-label="Sun Son Solar home">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>Sun Son Solar</span>
        </a>
        <h1 id="login-title">Log in</h1>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <p class="field-message" id="usernameMessage" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-input">
              <input id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" aria-label="Show password">Show</button>
            </div>
            <p class="field-message" id="passwordMessage" aria-live="polite"></p>
          </div>

          <div class="login-options">
            <label class="remember-me"><input type="checkbox" name="remember"> Remember me</label>
            <a class="forgot-link" href="#" aria-label="Forgot your password">Forgot password?</a>
          </div>

          <button class="submit-button" type="submit">Log in</button>
          <p class="login-message" id="loginMessage" role="status">Your login details are ready to submit.</p>
        </form>
        <div class="divider" aria-label="or continue with"><span>or continue with</span></div>
        <div class="social-buttons" aria-label="Social sign in options">
          <button class="social-button" type="button" aria-label="Continue with Google"><span class="social-icon google-icon" aria-hidden="true">G</span><span>Google</span></button>
          <button class="social-button" type="button" aria-label="Continue with GitHub"><span class="social-icon github-icon" aria-hidden="true">GH</span><span>GitHub</span></button>
          <button class="social-button" type="button" aria-label="Continue with Facebook"><span class="social-icon facebook-icon" aria-hidden="true">f</span><span>Facebook</span></button>
        </div>
        <p class="create-account">New to Sun Son Solar? <a class="create-link" href="index.html">Create account</a></p>
        </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');

    function validateField(field, messageElement, message) {
      const hasError = !field.value.trim();
      field.setAttribute('aria-invalid', String(hasError));
      messageElement.textContent = hasError ? message : '';
      return !hasError;
    }

    [username, password].forEach((field) => {
      field.addEventListener('input', () => {
        field.setAttribute('aria-invalid', 'false');
        document.getElementById(`${field.id}Message`).textContent = '';
      });
    });

    document.querySelector('.password-toggle').addEventListener('click', (event) => {
      const button = event.currentTarget;
      const isVisible = password.type === 'text';
      password.type = isVisible ? 'password' : 'text';
      button.textContent = isVisible ? 'Show' : 'Hide';
      button.setAttribute('aria-label', `${isVisible ? 'Show' : 'Hide'} password`);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const usernameValid = validateField(username, document.getElementById('usernameMessage'), 'Username is required.');
      const passwordValid = validateField(password, document.getElementById('passwordMessage'), 'Password is required.');
      const isValid = usernameValid && passwordValid;
      document.getElementById('loginMessage').classList.toggle('visible', isValid);
      if (!isValid) (usernameValid ? password : username).focus();
    });
  </script>
</body>
</html>
